; -----------------------------------------------------------------------------
;  php-fpm pool for WordPress.
;  Listens on TCP 9000 because NGINX lives in another container: a unix socket
;  cannot be shared across containers without a bind mount we do not want.
; -----------------------------------------------------------------------------
[www]

user  = www-data
group = www-data

listen       = 9000
listen.owner = www-data
listen.group = www-data
listen.mode  = 0660

; Port 9000 is only `expose`d, never published: nothing outside the
; `inception` network can reach this pool.

pm                 = dynamic
pm.max_children      = 12
pm.start_servers     = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
pm.max_requests      = 500

; Keep the environment variables passed by docker-compose visible to PHP.
clear_env = no

; Logs go to the container's stdout/stderr so `docker logs wordpress` works.
access.log            = /dev/null
catch_workers_output  = yes
decorate_workers_output = no
php_admin_value[error_log] = /dev/stderr
php_admin_flag[log_errors] = on
