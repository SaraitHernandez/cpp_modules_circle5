; Runtime tuning for WordPress.
upload_max_filesize = 32M
post_max_size       = 32M
memory_limit        = 256M
max_execution_time  = 60

; Never leak stack traces to visitors; the logs are there for that.
display_errors      = Off
log_errors          = On

expose_php          = Off
date.timezone       = Europe/Madrid

opcache.enable                  = 1
opcache.memory_consumption      = 128
opcache.max_accelerated_files   = 10000
opcache.revalidate_freq         = 2
